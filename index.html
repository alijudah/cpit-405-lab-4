<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Great Auto Parts - Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form>
        <h1>Great Auto Parts - Order Form</h1>

        <label for="first-name">First Name:</label>
        <input
            type="text"
            id="first-name"
            name="first-name"
            placeholder="Enter your first name">

        <label for="last-name">Last Name:</label>
        <input
            type="text"
            id="last-name"
            name="last-name"
            placeholder="Enter your last name">

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address">

        <label for="phone">Phone number:</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number">

        <label for="make">Make:</label>
        <input
            type="text"
            id="make"
            name="make"
            placeholder="Make">

        <label for="model">Model:</label>
        <input
            type="text"
            id="model"
            name="model"
            placeholder="Model">

        <label for="year">Year:</label>
        <input
            type="number"
            id="year"
            name="year"
            placeholder="Year">

        <label for="date">Date:</label>
        <input
            type="date"
            id="date"
            name="date">

        <label for="spare-part">Spare Part:</label>
        <input
            type="text"
            id="spare-part"
            name="spare-part"
            placeholder="Enter the spare part you need">

        <label for="quantity">Quantity:</label>
        <input
            type="number"
            id="quantity"
            name="quantity"
            placeholder="Enter the quantity of the spare part you need">

        <label for="comment">Comment:</label>
        <textarea
            id="comment"
            name="comment"
            placeholder="Enter your comment"></textarea>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
